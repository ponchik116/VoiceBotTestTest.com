<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioProcessor - Заглушка мата для стримеров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ AudioProcessor для Стримера</h1>
            <p>Нажми кнопку «Запуск» — все маты заглушаются выбранным звуком</p>
        </header>

        <!-- Панель управления -->
        <div class="control-panel">
            <button id="startBtn" class="btn btn-start">
                <span class="icon">🎤</span> Запуск обработки
            </button>
            <button id="stopBtn" class="btn btn-stop" disabled>
                <span class="icon">⏹️</span> Остановить
            </button>
        </div>

        <!-- Настройка звука заглушки -->
        <div class="config-section">
            <h3>🔊 Звук для заглушки мата</h3>
            <div class="sound-config">
                <label for="soundUpload">Загрузить свой звук (MP3/WAV):</label>
                <input type="file" id="soundUpload" accept="audio/*">
                <button id="previewSoundBtn" class="btn-small">Прослушать</button>
            </div>
        </div>

        <!-- Выбор выходного устройства -->
        <div class="config-section">
            <h3>🎧 Выбор вывода звука</h3>
            <select id="outputDeviceSelect" class="device-select">
                <option value="">Системное устройство по умолчанию</option>
            </select>
            <button id="requestDeviceBtn" class="btn-small">Обновить список устройств</button>
            <p class="hint">💡 Подсказка: Виртуальные кабели (VB-Cable, BlackHole) появятся здесь после установки драйверов</p>
        </div>

        <!-- Статус и мониторинг -->
        <div class="status-card">
            <div class="status-header">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Не запущен</span>
            </div>
            <div class="audio-meter" id="audioMeter">
                <div class="meter-fill"></div>
            </div>
            <div class="log-area" id="logArea">
                <div class="log-entry system">🎙️ Система готова, нажмите «Запуск обработки»</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
